name: starbridge
services:
  postgres:
    image: postgres:18-bookworm
    container_name: starbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starbridge}
      POSTGRES_USER: ${POSTGRES_USER:-starbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  app:
    image: starbridge-app:${APP_VERSION:-latest}
    build:
      context: .
      args:
        VCS_REF: ${APP_VERSION:-local}
    container_name: starbridge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5876:18970"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-starbridge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starbridge}
      APP_VERSION: ${APP_VERSION:-local}
      MAINTENANCE_DIR: /run/starbridge-maintenance
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY; preserve it when migrating data}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD for an empty database}
      TZ: Asia/Shanghai
    volumes:
      - ./.maintenance:/run/starbridge-maintenance
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 130s
    networks: [private]
networks:
  private:
    name: starbridge_private
    ipam:
      config:
        - subnet: ${STARBRIDGE_SUBNET:-10.87.60.0/24}
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-starbridge_postgres_data}
